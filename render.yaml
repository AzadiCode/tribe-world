services:
  - type: web
    name: tribe-world
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 8 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: SECRET_KEY
        generateValue: true
