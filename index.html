<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جهان زنده قبیله</title>
<style>
:root{--night:#14182b;--sand:#e9dcc0;--moss:#7fb069;--ember:#e8793a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#cfe3ea;font-family:Tahoma,"Segoe UI",sans-serif;color:var(--sand)}
canvas{display:block}
.glass{background:rgba(20,24,43,.82);backdrop-filter:blur(6px);border-radius:14px}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#title{align-self:flex-start;padding:8px 14px;font-size:20px;font-weight:700;letter-spacing:.5px}
#title small{font-weight:400;font-size:12px;opacity:.7;margin-inline-start:8px}
#stats{display:flex;flex-wrap:wrap;gap:6px}
.st{padding:6px 10px;font-size:13px;display:flex;gap:6px;align-items:baseline}
.st b{font-size:16px;color:#fff}.st.ok b{color:var(--moss)}.st.warn b{color:var(--ember)}
#ev{position:fixed;bottom:max(8px,env(safe-area-inset-bottom));right:8px;left:8px;max-width:420px;padding:10px 12px;max-height:34vh;overflow:auto;font-size:13px;line-height:1.7}
#ev h3{margin:0 0 4px;font-size:13px;color:var(--ember)}#ev div{padding:2px 0;border-top:1px solid rgba(233,220,192,.12)}
#ev time{opacity:.5;font-size:11px;margin-inline-end:6px}
#dot{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;width:9px;height:9px;border-radius:50%;background:var(--moss)}
#dot.off{background:var(--ember)}
@media(max-width:520px){#ev{max-height:26vh;font-size:12px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="dot" title="اتصال زنده"></div>
<div id="top"><div id="title" class="glass"><span id="cn">قبیله</span><small>جهان زنده</small></div><div id="stats"></div></div>
<div id="ev" class="glass"><h3>اتفاقات اخیر</h3><div id="evl">…</div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const CELL=2, fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:0});
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcfe3ea);scene.fog=new THREE.Fog(0xcfe3ea,70,150);
const cam=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.5,300);cam.position.set(34,40,34);
const ctl=new OrbitControls(cam,renderer.domElement);
Object.assign(ctl,{enableDamping:true,maxPolarAngle:1.15,minDistance:14,maxDistance:90,screenSpacePanning:false});
scene.add(new THREE.HemisphereLight(0xffffff,0x8fae7a,.85));
const sun=new THREE.DirectionalLight(0xfff0d0,1.4);sun.position.set(30,50,20);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-50,right:50,top:50,bottom:-50,far:150});scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshLambertMaterial({color:0x9ccc72}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const isle=new THREE.Mesh(new THREE.BoxGeometry(82,1,82),new THREE.MeshLambertMaterial({color:0x8dbf62}));isle.position.y=-.5;isle.receiveShadow=true;scene.add(isle);
const mats={};const M=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c,flatShading:true}));
function B(w,h,d,c,x=0,y=0,z=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y+h/2,z);m.castShadow=m.receiveShadow=true;return m}
function C(r,h,c,x=0,y=0,z=0,seg=8,r2=null){const m=new THREE.Mesh(new THREE.CylinderGeometry(r2??r,r,h,seg),M(c));m.position.set(x,y+h/2,z);m.castShadow=true;return m}
function roof(w,h,c,y){const m=new THREE.Mesh(new THREE.ConeGeometry(w,h,4),M(c));m.rotation.y=Math.PI/4;m.position.y=y+h/2;m.castShadow=true;return m}
const build={
hall(g){g.add(B(1.8,.5,1.8,0xb9b2a3),B(1.2,.9,1.2,0xd8b47a,0,.5),roof(1,.8,0xa8442c,1.4),C(.04,1,0x5b3b25,.5,1.6,.5,6));const f=B(.4,.25,.02,0xe8793a,.7,2.3,.5);g.add(f)},
house(g){g.add(B(1.1,.7,1.1,0xefe1bf),B(.25,.4,.02,0x6b4a2b,0,0,.56),roof(.95,.7,0xb5533a,.7))},
farm(g){g.add(B(1.8,.06,1.8,0x6b4a2b));for(let i=-2;i<=2;i++)g.add(B(1.6,.18,.16,i%2?0xc9b43c:0x5fa04a,0,.06,i*.32));g.add(B(.12,.6,.12,0x5b3b25,.75,.06,.75))},
lumber(g){g.add(B(.9,.6,.8,0x9a6b3f,-.3,0,-.3),roof(.8,.5,0x5b3b25,.6));for(let i=0;i<3;i++){const l=C(.14,.9,0xb8864f,.5,.14+(i>1?.25:0),.3-i%2*.3+(i>1?.15:0),8);l.rotation.z=Math.PI/2;g.add(l)}},
mine(g){const h=new THREE.Mesh(new THREE.ConeGeometry(1,1.3,6),M(0x7d7f86));h.position.y=.65;h.castShadow=true;g.add(h,B(.5,.45,.15,0x20222a,0,0,.7))},
market(g){for(let i=-1;i<=1;i++){g.add(B(.5,.4,.5,0x8a5a33,i*.6,0,0),B(.58,.08,.6,i%2?0xe8793a:0x3f8fb0,i*.6,.8,0));g.add(C(.03,.4,0x5b3b25,i*.6-.25,.4,.25,5))}},
road(g){g.add(B(2,.05,2,0xc9b48a))},
tree(g){const s=.8+Math.random()*.6;g.add(C(.1*s,.5*s,0x6b4a2b,0,0,0,6));for(let i=0;i<2;i++){const c=new THREE.Mesh(new THREE.ConeGeometry((.7-i*.2)*s,(1+i*.1)*s,7),M(i?0x3f8a4a:0x4f9d55));c.position.y=(.7+i*.5)*s;c.castShadow=true;g.add(c)}}};
const objs=new Map(),spots=[];
function addB(b){const g=new THREE.Group();build[b.type]?.(g);g.position.set(b.x*CELL,0,b.z*CELL);g.rotation.y=b.type==='hall'?0:b.rot*Math.PI/180;g.scale.setScalar(.01);g.userData={b,t:0};scene.add(g);objs.set(b.id,g)}
// شهروندان
const cits=[],skin=[0xf1c9a0,0xd9a577,0xb67d54,0x8a5a3c],cloth=[0xe8793a,0x3f8fb0,0xc9b43c,0xa4508b,0x5fa04a];
function mkCit(){const g=new THREE.Group(),r=a=>a[Math.random()*a.length|0];g.add(C(.14,.4,r(cloth),0,.05,0,6,.1));const h=new THREE.Mesh(new THREE.SphereGeometry(.12,8,6),M(r(skin)));h.position.y=.58;g.add(h);g.traverse(o=>o.castShadow=true);
const p=pick();g.position.set(p.x,0,p.z);scene.add(g);return {g,tx:p.x,tz:p.z,wait:Math.random()*2,sp:.8+Math.random()*.8}}
function pick(){const s=spots.length?spots[Math.random()*spots.length|0]:{x:0,z:0};return {x:s.x+(Math.random()-.5)*1.2,z:s.z+(Math.random()-.5)*1.2}}
// همگام‌سازی
let rev=-1;
function sync(w){rev=w.rev;document.getElementById('cn').textContent=w.country.name;
const ids=new Set(w.buildings.map(b=>b.id));
for(const [id,g] of objs)if(!ids.has(id)){scene.remove(g);objs.delete(id)}
for(const b of w.buildings){const g=objs.get(b.id);if(!g)addB(b);else{const o=g.userData.b;if(o.x!==b.x||o.z!==b.z){g.position.set(b.x*CELL,0,b.z*CELL);g.userData.b=b}}}
spots.length=0;w.buildings.filter(b=>b.type==='road'||b.type==='hall').forEach(b=>spots.push({x:b.x*CELL,z:b.z*CELL}));
const s=w.stats,cap=w.capacity,fd=s.food<=0;
document.getElementById('stats').innerHTML=[['👥 جمعیت',fa(s.pop)+' / '+fa(cap),s.pop>=cap?'warn':'ok'],['💰 پول',fa(s.money)],['🌾 غذا',fa(s.food),fd?'warn':''],['🪵 چوب',fa(s.wood)],['🪨 سنگ',fa(s.stone)],['▶️ مشترکان',fa(s.subs)]].map(([a,b,c])=>`<div class="st glass ${c||''}">${a} <b>${b}</b></div>`).join('');
document.getElementById('evl').innerHTML=w.events.slice(0,8).map(e=>`<div><time>${new Date(e.t).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'})}</time>${e.text.replace(/</g,'&lt;')}</div>`).join('');
const n=Math.min(s.pop,60);while(cits.length<n)cits.push(mkCit());while(cits.length>n){scene.remove(cits.pop().g)}}
async function poll(){const dot=document.getElementById('dot');try{const r=await fetch('/api/world?since='+rev,{cache:'no-store'});const w=await r.json();if(!w.same)sync(w);dot.className=''}catch(e){dot.className='off'}}
await poll();setInterval(poll,4000);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=Math.min(clock.getDelta(),.1),t=clock.elapsedTime;
for(const g of objs.values()){const u=g.userData;if(u.t<1){u.t=Math.min(1,u.t+dt*2);const e=1-Math.pow(1-u.t,3);g.scale.setScalar(Math.max(.01,e*(1+.15*Math.sin(u.t*Math.PI))))}}
for(const c of cits){if(c.wait>0){c.wait-=dt;c.g.position.y=0;continue}const dx=c.tx-c.g.position.x,dz=c.tz-c.g.position.z,d=Math.hypot(dx,dz);
if(d<.1){c.wait=1+Math.random()*3;const p=pick();c.tx=p.x;c.tz=p.z}else{c.g.position.x+=dx/d*c.sp*dt;c.g.position.z+=dz/d*c.sp*dt;c.g.rotation.y=Math.atan2(dx,dz);c.g.position.y=Math.abs(Math.sin(t*9+c.sp*7))*.06}}
ctl.target.x=Math.max(-36,Math.min(36,ctl.target.x));ctl.target.z=Math.max(-36,Math.min(36,ctl.target.z));ctl.update();renderer.render(scene,cam)});
</script>
</body></html>
