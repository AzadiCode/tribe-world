<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جهان زنده قبیله</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--ink:#0d2a2c;--glass:rgba(11,36,38,.72);--line:rgba(255,236,190,.16);--cream:#fff3d6;--gold:#ffc247;--jade:#3ddc97;--ember:#ff8a4c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#d6f0e4;font-family:Vazirmatn,Tahoma,sans-serif;color:var(--cream)}

.g{background:var(--glass);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border:1px solid var(--line);box-shadow:0 6px 22px rgba(4,20,22,.35),inset 0 1px 0 rgba(255,255,255,.08)}
#hud{position:fixed;inset:0;pointer-events:none;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
#res{display:flex;gap:7px;width:100%;max-width:460px}
.chip{flex:1;position:relative;height:46px;border-radius:23px;padding-inline-start:46px;padding-inline-end:8px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.chip .ic{position:absolute;inset-inline-start:-2px;top:-3px;width:52px;height:52px;border-radius:50%;padding:12px;color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.35),inset 0 2px 3px rgba(255,255,255,.5),inset 0 -3px 5px rgba(0,0,0,.25)}
.chip b{font-size:17px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}.chip small{font-size:9.5px;opacity:.65;line-height:1.2}
.chip .d{position:absolute;top:-2px;inset-inline-end:10px;font-size:12px;font-weight:800;color:var(--jade);animation:fl 1.6s ease-out forwards}
@keyframes fl{to{transform:translateY(-22px);opacity:0}}
#tier{margin-top:12px;display:flex;align-items:center;gap:10px;padding:6px 16px;border-radius:99px}
#tier h1{margin:0;font-size:15px;font-weight:800;color:var(--gold)}
#path{display:flex;align-items:center;direction:ltr}#path i{width:9px;height:9px;border-radius:50%;background:#fff3d633}#path i.on{background:var(--gold);box-shadow:0 0 0 3px #ffc24744}#path i.past{background:var(--jade)}#path u{width:14px;height:2px;background:#fff3d633}
#toast{position:absolute;top:128px;padding:9px 16px;border-radius:14px;font-size:13px;max-width:92%;text-align:center;opacity:0;transform:translateY(-8px);transition:.35s}#toast.on{opacity:1;transform:none}
#side{position:fixed;inset-inline-start:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.btn{width:44px;height:44px;border-radius:14px;padding:11px;color:var(--cream);cursor:pointer;border:1px solid var(--line)}.btn:active{transform:scale(.94)}
#bot{margin-top:auto;width:100%;max-width:460px;display:flex;flex-direction:column;gap:8px}
#quest{border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:12px}
#quest .fl{width:34px;height:34px;flex:none;border-radius:50%;padding:8px;background:linear-gradient(145deg,#ffd36b,#ff8a4c);color:#5a2a05}
#quest .tx{flex:1;min-width:0}#quest strong{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar{height:7px;border-radius:9px;background:#ffffff1f;margin:6px 0 3px;overflow:hidden}#bar u{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--jade),var(--gold));transition:width .8s cubic-bezier(.2,.8,.2,1)}
#quest small{font-size:11px;opacity:.7}
#cap{pointer-events:auto;border-radius:18px;padding:16px 18px 12px;font-size:15px;line-height:1.9;min-height:96px;position:relative;cursor:pointer}
#cap .who{position:absolute;top:-12px;inset-inline-start:16px;background:linear-gradient(145deg,#ffd36b,#ffb02e);color:#4a2a05;font-size:11.5px;font-weight:800;padding:2px 12px;border-radius:99px}
#cap em{position:absolute;bottom:6px;inset-inline-end:14px;font-size:10.5px;opacity:.5;font-style:normal}
#ev{position:fixed;inset-inline-start:64px;top:50%;transform:translateY(-50%);width:min(290px,calc(100% - 80px));max-height:60vh;overflow:auto;padding:12px 14px;border-radius:16px;font-size:12.5px;line-height:1.8;display:none;pointer-events:auto}
#ev div{padding:6px 0;border-top:1px solid var(--line)}#ev div:first-child{border:0}#ev time{display:block;font-size:10.5px;opacity:.5}
#dot{position:fixed;inset-inline-end:10px;bottom:4px;width:7px;height:7px;border-radius:50%;background:var(--jade)}#dot.off{background:var(--ember)}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>

<div id="bot"><div id="quest" class="g"></div><div id="cap" class="g"><span class="who">بنیان‌گذار</span><span id="ct"></span><em>برای ادامه بزن</em></div></div></div>
<div id="side"><div id="bs" class="btn g" title="داستان"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5c3-1.5 6-1.5 8 .5 2-2 5-2 8-.5v13c-3-1.5-6-1.5-8 .5-2-2-5-2-8-.5z"/><path d="M12 5.5v13"/></svg></div>
<div id="be" class="btn g" title="اتفاقات"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 8a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7zM10 19a2 2 0 0 0 4 0"/></svg></div></div>
<div id="ev" class="g"></div><div id="dot"></div>
<script type="module">

house(g){bx(g,1.4,.12,1.2,0x9b9486);bx(g,1.2,.8,1.0,0xf6f1e7,0,.12);gable(g,1.5,.7,1.3,0xc9402f,.92);bx(g,.3,.5,.04,0x7b4a2a,0,0,.52);bx(g,.28,.26,.04,0x7ec8e8,-.4,.35,.52);bx(g,.28,.26,.04,0x7ec8e8,.4,.35,.52);bx(g,.16,.5,.16,0xb8aea0,.4,.9,-.2)},

// HUD و همگام‌سازی
let rev=-1,seenEv=null,tmT;const tgt={pop:0,money:0,food:0},disp={pop:0,money:0,food:0},last={};

const RS=[['pop','جمعیت','نفر','linear-gradient(145deg,#4be8a8,#12a06b)',0],['money','خزانه','میلیون تومان','linear-gradient(145deg,#ffd36b,#e89a14)',1],['food','غذا','کیلوگرم','linear-gradient(145deg,#ffa36b,#e5562a)',0]];

// داستان آغازین (از ویدیو)
const story=['می‌شه از این زمین خالی... یه کشور ساخت؟','منم بنیان‌گذار و رئیس موقتم.','غذا؟ صفر.','اول، دو میلیون برای خونهٔ رئیس...','هر کدومتون فالو کنین، هر فالو = ۱ نفر + ۱ میلیون تومن به خزانهٔ این دنیای مجازی اضافه می‌شه!','مصرف هر نفر: روزی نیم کیلو غذا. کم بیاریم، باید از خزانه بخریم!','صد نفر که شدیم، اسم اینجا رو با رأی شما انتخاب می‌کنیم.','دو هزار نفر که شدیم، نظام حکومت: پادشاهی یا جمهوری. خودتون هم می‌تونین نامزد بشین!'];
let tm=0,si=0;function say(i){clearTimeout(tm);si=i;if(i>=story.length){$('cap').style.display='none';$('bot').style.paddingBottom='0';localStorage.seen=1;return}$('cap').style.display='';typ(story[i]);tm=setTimeout(()=>say(i+1),Math.max(3600,story[i].length*85))}
let ty;function typ(t){clearInterval(ty);let n=0;$('ct').textContent='';ty=setInterval(()=>{$('ct').textContent=t.slice(0,++n);if(n>=t.length)clearInterval(ty)},28)}
$('cap').onclick=()=>say(si+1);$('bs').onclick=()=>say(0);$('be').onclick=()=>{const e=$('ev');e.style.display=e.style.display==='block'?'none':'block'};
await poll();setInterval(poll,4000);localStorage.seen?$('cap').style.display='none':say(0);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)});
const ck=new THREE.Clock(),START=new THREE.Vector3(46,52,56);let intro=0;ctl.enabled=false;
R.setAnimationLoop(()=>{const dt=Math.min(ck.getDelta(),.1),t=ck.elapsedTime;
for(const k in disp){disp[k]+=(tgt[k]-disp[k])*Math.min(1,dt*5);const v=Math.abs(tgt[k]-disp[k])<.05?tgt[k]:disp[k],txt=fa(v,k==='money'?1:0);if(last[k]!==txt){last[k]=txt;$('v_'+k).textContent=txt}}
if(intro<1){intro=Math.min(1,intro+dt/3.2);const e=1-Math.pow(1-intro,3);cam.position.lerpVectors(START,HOME,e);cam.lookAt(0,0,0);if(intro>=1){ctl.enabled=true;ctl.update()}}
for(const c of clouds){c.position.x+=dt*.8;if(c.position.x>90)c.position.x=-90}
for(const g of objs.values())if(g.userData.sw!==undefined)g.rotation.z=Math.sin(t*1.3+g.userData.sw)*.025;
for(const g of objs.values()){const u=g.userData;if(u.t<1){u.t=Math.min(1,u.t+dt*1.8);const e=1-Math.pow(1-u.t,3);g.scale.setScalar(Math.max(.01,e*(1+.12*Math.sin(u.t*Math.PI))))}}
for(const c of cits){if(c.wait>0){c.wait-=dt;continue}const dx=c.tx-c.g.position.x,dz=c.tz-c.g.position.z,d=Math.hypot(dx,dz);
if(d<.1){c.wait=1+Math.random()*3;const p=pick();c.tx=p.x;c.tz=p.z;c.g.position.y=0}else{c.g.position.x+=dx/d*c.sp*dt;c.g.position.z+=dz/d*c.sp*dt;c.g.rotation.y=Math.atan2(dx,dz);c.g.position.y=Math.abs(Math.sin(t*9+c.sp*7))*.05}}
ctl.target.x=Math.max(-34,Math.min(34,ctl.target.x));ctl.target.z=Math.max(-34,Math.min(34,ctl.target.z));ctl.update();R.render(scene,cam)});
</script>
</body></html>
