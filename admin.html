<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل مدیریت قبیله</title>
<style>
:root{--night:#14182b;--sand:#e9dcc0;--moss:#7fb069;--ember:#e8793a}
*{box-sizing:border-box}body{margin:0;background:var(--night);color:var(--sand);font-family:Tahoma,sans-serif;padding:12px;max-width:720px;margin-inline:auto}
h1{font-size:20px}h2{font-size:15px;color:var(--ember);margin:0 0 8px}section{background:#1d2340;border-radius:12px;padding:12px;margin:10px 0}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid #3a4272;background:#10142a;color:var(--sand);margin:2px}
input{width:90px}input.w{width:100%}button{background:var(--ember);color:#14182b;border:0;font-weight:700;cursor:pointer}button.s{background:#3a4272;color:var(--sand)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}#msg{position:sticky;top:0;padding:8px;border-radius:8px;background:var(--moss);color:#14182b;display:none}#msg.err{background:#d9534f;color:#fff}
.b{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #2c3463;padding:4px 0;font-size:13px}#list{max-height:300px;overflow:auto}
</style></head><body>
<h1>🛠️ پنل مدیریت قبیله <a href="/" style="font-size:12px;color:var(--moss)">مشاهده جهان</a></h1><div id="msg"></div>
<section id="login"><h2>ورود</h2><div class="row"><input class="w" id="key" type="password" placeholder="ADMIN_KEY" style="flex:1"><button onclick="login()">ورود</button></div></section>
<div id="panel" hidden>
<section><h2>📊 وضعیت</h2><div id="st"></div></section>
<section><h2>🎬 ثبت مشترک / مشارکت یوتیوب</h2><div class="row"><select id="ck"><option value="subscriber">مشترک جدید</option><option value="contribution">مشارکت</option></select><input id="cn" type="number" value="1" min="1"><input class="w" id="cnote" placeholder="یادداشت (نام مشارکت‌کننده…)" style="flex:1"><button onclick="contrib()">ثبت</button></div></section>
<section><h2>⚖️ تغییر جمعیت و منابع (عدد منفی = کاهش)</h2><div class="row" id="adj"></div><div class="row"><input class="w" id="anote" placeholder="یادداشت برای اتفاقات (اختیاری)" style="flex:1"><button onclick="adjust()">اعمال</button></div><div class="row"><input class="w" id="name" placeholder="نام کشور" style="flex:1"><button class="s" onclick="rename()">تغییر نام</button></div></section>
<section><h2>📜 اتفاق داستانی</h2><input class="w" id="et" placeholder="مثلاً: سیل مزارع را خراب کرد"><div class="row"><input id="ef" type="number" placeholder="غذا ±"><input id="em" type="number" placeholder="پول ±"><input id="ep" type="number" placeholder="جمعیت ±"><button onclick="story()">اعمال اتفاق</button></div></section>
<section><h2>🏗️ ساخت ساختمان</h2><div class="row"><select id="bt"></select><input id="bx" type="number" placeholder="x (خالی=خودکار)"><input id="bz" type="number" placeholder="z"><button onclick="addB()">بساز</button></div></section>
<section><h2>🧱 ساختمان‌ها</h2><div id="list"></div></section></div>
<script>
const $=id=>document.getElementById(id);let T=sessionStorage.tk||'',W=null;
const msg=(t,e)=>{const m=$('msg');m.textContent=t;m.className=e?'err':'';m.style.display='block';setTimeout(()=>m.style.display='none',3500)};
async function api(p,m='GET',b){const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Admin-Token':T},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(r.status===401&&T){logout();}if(!r.ok){msg(j.error||'خطا',1);throw 0}return j}
function logout(){T='';sessionStorage.tk='';$('login').hidden=false;$('panel').hidden=true}
async function login(){try{const j=await api('/api/admin/login','POST',{key:$('key').value});T=j.token;sessionStorage.tk=T;show()}catch(e){}}
const R={pop:'👥 جمعیت',money:'💰 پول',food:'🌾 غذا',wood:'🪵 چوب',stone:'🪨 سنگ',subs:'▶️ مشترکان'};
$('adj').innerHTML=Object.entries(R).map(([k,v])=>`<label>${v}<br><input id="a_${k}" type="number" placeholder="±"></label>`).join('');
async function load(){W=await (await fetch('/api/world')).json();const s=W.stats;
$('st').innerHTML=`${W.country.name} — `+Object.entries(R).map(([k,v])=>`${v}: <b>${Math.round(s[k])}</b>`).join(' · ')+` (ظرفیت ${W.capacity})`;
$('bt').innerHTML=Object.entries(W.catalog).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('list').innerHTML=W.buildings.filter(b=>b.type!=='road'&&b.type!=='tree'||false).concat(W.buildings.filter(b=>b.type==='road'||b.type==='tree')).map(b=>`<div class="b"><span>${W.catalog[b.type]} #${b.id} (${b.x}, ${b.z})</span><span><button class="s" onclick="mv(${b.id},${b.x},${b.z})">جابه‌جایی</button><button onclick="del(${b.id})">حذف</button></span></div>`).join('')}
async function show(){$('login').hidden=true;$('panel').hidden=false;try{await load()}catch(e){}}
const done=async t=>{msg(t);await load()};
async function contrib(){await api('/api/admin/contribution','POST',{kind:$('ck').value,count:+$('cn').value,note:$('cnote').value});$('cnote').value='';done('ثبت شد ✅')}
async function adjust(){const b={note:$('anote').value};for(const k in R)b[k]=+$('a_'+k).value||0;await api('/api/admin/adjust','POST',b);for(const k in R)$('a_'+k).value='';$('anote').value='';done('اعمال شد ✅')}
async function rename(){if($('name').value){await api('/api/admin/adjust','POST',{name:$('name').value});done('نام تغییر کرد ✅')}}
async function story(){await api('/api/admin/event','POST',{text:$('et').value,effects:{food:+$('ef').value,money:+$('em').value,pop:+$('ep').value}});$('et').value='';done('اتفاق ثبت شد ✅')}
async function addB(){await api('/api/admin/building','POST',{type:$('bt').value,x:$('bx').value,z:$('bz').value});done('ساخته شد ✅')}
async function del(id){if(confirm('حذف شود؟')){await api('/api/admin/building/'+id,'DELETE');done('حذف شد')}}
async function mv(id,x,z){const v=prompt('مختصات جدید (x,z)',x+','+z);if(!v)return;const [nx,nz]=v.split(',').map(Number);await api('/api/admin/building/'+id,'PUT',{x:nx,z:nz});done('جابه‌جا شد ✅')}
if(T)show();
</script></body></html>
